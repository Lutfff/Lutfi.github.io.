<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heraa's Library 🌸</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-main: #fff0f5;
            --bg-card: #ffffff;
            --primary: #f472b6;
            --primary-hover: #e11d48;
            --accent: #fda4af;
            --text-dark: #831843;
            --text-muted: #9d174d;
            --shadow: 0 10px 25px -5px rgba(244, 114, 182, 0.25);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* HEADER / HERO SECTION */
        header {
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f472b6 100%);
            padding: 50px 20px 60px;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 30px rgba(244, 114, 182, 0.2);
            position: relative;
        }

        header h1 {
            font-size: 2.8rem;
            color: #831843;
            font-weight: 700;
            margin-bottom: 5px;
        }

        header p {
            font-size: 1.1rem;
            color: #9d174d;
            margin-bottom: 30px;
        }

        /* SEARCH BOX */
        .search-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            display: flex;
            gap: 10px;
        }

        .search-box {
            width: 100%;
            padding: 16px 25px;
            font-size: 1rem;
            border: 2px solid #fbcfe8;
            border-radius: 30px;
            outline: none;
            background: white;
            color: var(--text-dark);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.3);
        }

        .btn-search {
            background: #db2777;
            color: white;
            border: none;
            padding: 0 28px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-search:hover {
            background: #be185d;
            transform: translateY(-2px);
        }

        /* QUICK CATEGORIES */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .chip {
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #fbcfe8;
        }

        .chip:hover, .chip.active {
            background: #db2777;
            color: white;
            border-color: #db2777;
        }

        /* MAIN CONTENT */
        main {
            max-width: 1200px;
            margin: 40px auto 0;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #831843;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* BOOK GRID */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .book-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border: 1px solid #fce7f3;
            position: relative;
            overflow: hidden;
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px -5px rgba(244, 114, 182, 0.4);
        }

        .cover-wrapper {
            width: 100%;
            height: 260px;
            border-radius: 12px;
            overflow: hidden;
            background: #fce7f3;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-author {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-detail {
            width: 100%;
            padding: 10px;
            background: #fce7f3;
            color: #db2777;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-detail:hover {
            background: #db2777;
            color: white;
        }

        /* LOADING & STATUS */
        .status-msg {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.2rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .spinner {
            border: 4px solid #fce7f3;
            border-top: 4px solid #db2777;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* MODAL DETAIL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(131, 24, 67, 0.4);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: white;
            border-radius: 25px;
            max-width: 650px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fce7f3;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #db2777;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            display: flex;
            gap: 25px;
        }

        .modal-cover {
            width: 180px;
            height: 250px;
            border-radius: 15px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: var(--shadow);
        }

        .modal-info h2 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .modal-info .authors {
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .modal-info .desc {
            font-size: 0.9rem;
            color: #4c0519;
            line-height: 1.6;
            margin-bottom: 20px;
            max-height: 150px;
            overflow-y: auto;
        }

        .btn-read {
            display: inline-block;
            padding: 12px 25px;
            background: #db2777;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .btn-read:hover {
            background: #be185d;
        }

        @media (max-width: 600px) {
            .modal-body {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .modal-cover {
                width: 140px;
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER SECTION -->
    <header>
        <h1>Pink Library 🌸</h1>
        <p>Cari & temukan ribuan buku impianmu di sini</p>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Ketik judul buku, penulis, atau genre..." onkeypress="handleKeyPress(event)">
            <button class="btn-search" onclick="searchBooks()">
                <i class="fa-solid fa-magnifying-glass"></i> Cari
            </button>
        </div>

        <div class="categories">
            <span class="chip active" onclick="quickSearch('Novel Indonesia', this)">🇮🇩 Novel Indo</span>
            <span class="chip" onclick="quickSearch('Romance', this)">💖 Romance</span>
            <span class="chip" onclick="quickSearch('Self Improvement', this)">✨ Self-Improvement</span>
            <span class="chip" onclick="quickSearch('Tere Liye', this)">📚 Tere Liye</span>
            <span class="chip" onclick="quickSearch('Bumi Manusia', this)">🌹 Sastra</span>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <div class="section-title">
            <i class="fa-solid fa-heart" style="color: #db2777;"></i>
            <span id="resultHeading">Rekomendasi Buku</span>
        </div>

        <div id="bookGrid" class="book-grid">
            <!-- Buku akan ditampilkan di sini lewat JavaScript -->
        </div>
    </main>

    <!-- MODAL POPUP -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeModalOutside(event)">
        <div class="modal-card">
            <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-body">
                <img id="modalCover" class="modal-cover" src="" alt="Cover Buku">
                <div class="modal-info">
                    <h2 id="modalTitle">Judul Buku</h2>
                    <div id="modalAuthor" class="authors">Penulis</div>
                    <p id="modalDesc" class="desc">Deskripsi buku akan muncul di sini...</p>
                    <a id="modalReadBtn" href="#" target="_blank" class="btn-read">
                        <i class="fa-solid fa-book-open"></i> Baca / Preview
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const grid = document.getElementById('bookGrid');
        const modal = document.getElementById('modalOverlay');

        // Pencarian Otomatis saat pertama kali dibuka
        window.addEventListener('DOMContentLoaded', () => {
            fetchGoogleBooks('Novel Indonesia');
        });

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchBooks();
            }
        }

        function searchBooks() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                fetchGoogleBooks(query);
            }
        }

        function quickSearch(keyword, element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('searchInput').value = keyword;
            fetchGoogleBooks(keyword);
        }

        async function fetchGoogleBooks(query) {
            document.getElementById('resultHeading').innerText = `Hasil untuk: "${query}"`;
            grid.innerHTML = `
                <div class="status-msg">
                    <div class="spinner"></div>
                    Mencari buku favoritmu...
                </div>
            `;

            try {
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=20`);
                const data = await response.json();

                if (!data.items || data.items.length === 0) {
                    grid.innerHTML = `<div class="status-msg">Oops! Buku tidak ditemukan. Coba kata kunci lain ya 💕</div>`;
                    return;
                }

                renderBooks(data.items);
            } catch (error) {
                console.error("Error fetching Google Books:", error);
                grid.innerHTML = `<div class="status-msg">Gagal mengambil data buku. Pastikan koneksi internetmu aman!</div>`;
            }
        }

        function renderBooks(books) {
            grid.innerHTML = '';

            books.forEach(book => {
                const info = book.volumeInfo;
                const title = info.title || 'Judul Tidak Tersedia';
                const authors = info.authors ? info.authors.join(', ') : 'Penulis Tidak Diketahui';
                
                // Ambil gambar cover & ganti http jadi https
                let cover = 'https://via.placeholder.com/200x300/fbcfe8/db2777?text=No+Cover';
                if (info.imageLinks && info.imageLinks.thumbnail) {
                    cover = info.imageLinks.thumbnail.replace('http:', 'https:');
                }

                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div>
                        <div class="cover-wrapper">
                            <img src="${cover}" alt="${title}" loading="lazy">
                        </div>
                        <div class="book-title" title="${title}">${title}</div>
                        <div class="book-author">${authors}</div>
                    </div>
                    <button class="btn-detail" onclick='openModal(${JSON.stringify(book).replace(/'/g, "&apos;")})'>
                        Lihat Detail
                    </button>
                `;

                grid.appendChild(card);
            });
        }

        function openModal(book) {
            const info = book.volumeInfo;
            
            document.getElementById('modalTitle').innerText = info.title || 'Tanpa Judul';
            document.getElementById('modalAuthor').innerText = info.authors ? info.authors.join(', ') : 'Penulis Tidak Diketahui';
            document.getElementById('modalDesc').innerText = info.description ? info.description : 'Tidak ada deskripsi rinci untuk buku ini.';
            
            let cover = 'https://via.placeholder.com/200x300/fbcfe8/db2777?text=No+Cover';
            if (info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)) {
                cover = (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail).replace('http:', 'https:');
            }
            document.getElementById('modalCover').src = cover;

            const readBtn = document.getElementById('modalReadBtn');
            if (info.previewLink || info.infoLink) {
                readBtn.href = info.previewLink || info.infoLink;
                readBtn.style.display = 'inline-block';
            } else {
                readBtn.style.display = 'none';
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function closeModalOutside(e) {
            if (e.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
```
